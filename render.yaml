# Render.com Blueprint for FathomVisual.LicenseServer
# Documentation: https://render.com/docs/blueprint-spec

databases:
  - name: fathomvisual-license-db
    databaseName: licensedb
    user: licenseserver
    plan: free
    region: oregon

services:
  - type: web
    name: fathomvisual-license-server
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: fathomvisual-license-db
          property: connectionString
      - key: LICENSE_KEYS_PATH
        value: /app/keys
      - key: CORS_ORIGINS
        value: "*"
    autoDeploy: true
